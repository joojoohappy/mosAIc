name: Deployment smoke test

# Vercel reports each finished deployment back to GitHub; smoke-test the
# website deployment it just created (read-only: no paid model calls).
on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'mos-a-ic-web')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        env:
          # Optional: Vercel "Protection Bypass for Automation" secret.
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/smoke.sh "${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}"
