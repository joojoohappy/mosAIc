name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m venv apps/backend/.venv
          apps/backend/.venv/bin/pip install -r apps/backend/requirements-dev.txt pip-audit
          pnpm exec playwright-core install --with-deps chromium

      - name: Run every check
        run: bash scripts/test-all.sh

      - name: Dependency audit
        run: |
          pnpm audit --audit-level high
          apps/backend/.venv/bin/pip-audit -r apps/backend/requirements.txt
